version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  rich:
    format: "%(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: simple
    filename: logs/ts_llm_bridge.log
    mode: a

loggers:
  ts_llm_bridge:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  kedro:
    level: INFO
    handlers: [console]
    propagate: false

  # Silencia verbose dos providers LLM
  openai:
    level: WARNING
  anthropic:
    level: WARNING
  httpx:
    level: WARNING

root:
  level: WARNING
  handlers: [console]
