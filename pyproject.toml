[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-llm-bridge"
version = "0.1.0"
description = "TS-LLM Bridge — análise de séries temporais com LLM usando Kedro"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Kedro core + datasets
    "kedro>=1.0",
    "kedro-datasets[pandas.CSVDataset,json.JSONDataset]>=3.0",
    # LLM
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    # Time series
    "statsmodels>=0.14",
    "pandas>=2.0",
    "numpy>=1.26",
    # Validação
    "pydantic>=2.0",
    # Utilitários
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "kedro-telemetry",
    "ruff",
    "ipykernel",
    "notebook",
]

viz = [
    "kedro-viz>=9.0",     # kedro viz  — visualiza o grafo de pipeline
]

[project.entry-points."kedro.hooks"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.kedro]
package_name = "ts_llm_bridge"
project_name = "TS-LLM Bridge"
kedro_init_version = "1.3.1"
tools = []
example_pipeline = false
source_dir = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "--cov=ts_llm_bridge --cov-report=term-missing"
testpaths = ["tests"]

[tool.kedro_telemetry]
project_id = "e0cfb45e48ae4e1bac4fddb155389d1e"
